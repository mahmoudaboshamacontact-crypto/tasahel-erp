<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>عدادات المالك — تساهيل</title>
<style>
:root{--bg:#0e0d0c;--card:#1a1816;--line:rgba(255,255,255,.1);--text:#f4eee8;--mute:#a0978e;--acc:#ff9d6c;--ok:#5fd3b3;--warn:#f5c15a;--bad:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#faf6f1;--card:#fff;--line:rgba(40,25,10,.1);--text:#26201b;--mute:#7b6f64;--acc:#e8590c;--ok:#0f9d77;--warn:#ca8a04;--bad:#d93636}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:1.3rem;margin:.2rem 0}.sub{color:var(--mute);font-size:.8rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,a.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.card h3{margin:0 0 6px;font-size:.85rem;color:var(--mute);font-weight:600}
svg{width:100%;max-width:210px;overflow:visible}.val{font-size:1.45rem;font-weight:700;margin-top:-52px;position:relative;font-variant-numeric:tabular-nums}
.nd{transform-origin:100px 100px;transform:rotate(-135deg);transition:transform 1.3s cubic-bezier(.34,1.45,.5,1)}
.arcv{transition:stroke-dasharray 1.3s cubic-bezier(.34,1.2,.5,1),stroke .6s}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-end:5px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.nd,.arcv{transition:none}.live{animation:none}}
.note{font-size:.72rem;color:var(--mute);margin-top:6px;min-height:1.1em}
.desc{font-size:.72rem;color:var(--mute);margin:-2px 0 4px;line-height:1.5;min-height:2.2em}
.sec{margin:18px 0 8px;font-weight:700}
.chk{display:flex;gap:10px;text-align:start;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line)}.chk:first-child{border-top:0}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:700;margin-top:2px}
.chk b{display:block;font-size:.85rem;color:var(--text)}.chk span{font-size:.75rem;color:var(--mute);line-height:1.6}.list{font-size:.78rem;color:var(--mute);text-align:start;line-height:1.7}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin:2px;font-size:.72rem}
.msg{padding:2rem;text-align:center;color:var(--mute)}.link{color:var(--acc)}
</style></head><body>
<div class="bar"><div><h1>عدادات المالك</h1><div class="sub" id="upd">—</div></div><div><button id="rf">تحديث</button> <a class="btn" href="/">النظام</a></div></div>
<div id="root"><div class="msg">جارٍ التحميل…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(function(){

var URL_=localStorage.getItem('sb_url')||'https://avehvjqifswsyayckpvx.supabase.co',KEY=localStorage.getItem('sb_key')||'';

  c.appendChild(s);var v=$('div','val','0');v.dir='ltr';c.appendChild(v);var nt=$('div','note','');c.appendChild(nt);

    fg.setAttribute('stroke-dasharray',(L*pct/100)+' '+L);fg.setAttribute('stroke',color);nt.textContent=note||'';
    var from=cur,t0=performance.now();cancelAnimationFrame(raf);
    (function f(t){var k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);cur=from+(val-from)*e;v.textContent=fmt(cur);if(k<1)raf=requestAnimationFrame(f)})(t0)}};
  G[id]=g;return g}
function col(p,inv){var g=inv?100-p:p;return g>=70?'var(--ok)':g>=40?'var(--warn)':'var(--bad)'}

function setLat(l){mk('lat','سرعة الاتصال بالقاعدة (حي)',function(x){return Math.round(x)+' ms'}).set(l,Math.min(100,l/10),l<300?'var(--ok)':l<800?'var(--warn)':'var(--bad)','وسيط آخر قياسات')}
var lats=[];async function ping(){var s=performance.now();await sb.rpc('my_role');var t=performance.now()-s;lats.push(t);if(lats.length>5)lats.shift();return t}
async function latency(){mk('lat','سرعة الاتصال بالقاعدة (حي)',function(x){return Math.round(x)+' ms'});for(var i=0;i<5;i++){var t=await ping();if(G.lat&&G.lat.el.parentNode)setLat(Math.round(t))}return Math.round(median(lats))}
async function run(){
  if(!KEY){msg('مفيش مفتاح Supabase محفوظ في المتصفح ده. افتح النظام وسجّل دخول الأول.',1);return}

  var lat=await latency();
  var st=await sb.rpc('owner_stats');
  if(st.error){msg('شغّل ملف sql/owner-stats.sql في Supabase الأول. ('+(st.error.message||'')+')');return}
  var d=st.data,nav=performance.getEntriesByType('navigation')[0],load=nav?Math.round(nav.loadEventEnd||nav.domInteractive):0;
  var g=document.getElementById('gs');if(!g){root.innerHTML='';g=$('div','grid');g.id='gs';root.appendChild(g);var tail=$('div');tail.id='tl';root.appendChild(tail)}
  var dbp=d.db_bytes/(500*1048576)*100,up=d.users/50000*100;
  var gm=[['db','حجم القاعدة (حد 500MB)',function(x){return fmtB(x)},'مساحة بياناتك على Supabase. لو قربت من 500MB النظام هيتوقف عن الحفظ.'],['us','المستخدمين (حد 50 ألف)',function(x){return String(Math.round(x))},'عدد الحسابات المسجّلة (موظفين ومنفذين). مش هتقرب من الحد.'],['lat','سرعة الاتصال بالقاعدة (حي)',function(x){return Math.round(x)+' ms'},'كام ملّي ثانية بياخد الرد من Supabase. أقل من 300 ممتاز، فوق 800 بطيء.'],['ld','تحميل الصفحة',function(x){return Math.round(x)+' ms'},'وقت فتح الصفحة دي من جهازك. بيتأثر بسرعة النت عندك.'],['sec','مؤشر الأمان',function(x){return String(Math.round(x))},'ملخص فحوصات الأمان تحت. 100 = مفيش مشاكل ظاهرة، وأقل معناه فيه حاجة محتاجة نظرة.'],['td','بنود اليوم',function(x){return String(Math.round(x))},'عدد الخدمات اللي اتسجّلت النهارده. مؤشر على حجم الشغل.']];
  gm.forEach(function(x){var o=mk(x[0],x[1],x[2],x[3]);if(o.el.parentNode!==g)g.appendChild(o.el)});
  var sc=100;if(d.rls_off.length)sc-=25;sc-=Math.min(40,d.open_policies.length*8);sc-=Math.min(15,(d.open_staff||[]).length);sc-=Math.min(20,d.anon_funcs.length*3);if(d.checks&&d.checks.user_roles_rls_ok===false)sc-=30;if(d.checks&&d.checks.public_create)sc-=20;sc=Math.max(0,sc);
  G.db.set(d.db_bytes,dbp,col(dbp,1),Math.round(dbp)+'% من الباقة المجانية');

  setLat(lat);
  G.ld.set(load,Math.min(100,load/30),load<1500?'var(--ok)':load<3500?'var(--warn)':'var(--bad)','الصفحة دي');
  G.sec.set(sc,sc,col(sc),'من 100');
  G.td.set(d.lines_today,Math.min(100,d.lines_today),'var(--acc)','إجمالي البنود: '+d.lines_total);
  var tl=document.getElementById('tl');tl.innerHTML='';var rootSave=root;root=tl;

  function block(t,arr,empty){root.appendChild($('div','sec',t));var b=$('div','card list');if(!arr.length)b.textContent=empty;else arr.forEach(function(x){b.appendChild($('span','tag',x))});root.appendChild(b)}
  (function(){var c=d.checks||{},rows=[];
    function add(ok,t,why,bad){rows.push([ok,t,ok===true?why:(bad||why)])}
    add(d.rls_off.length===0,'كل الجداول محمية بنظام الصلاحيات (RLS)','كل جدول في قاعدتك مقفول، ومحدش يقرأ أو يكتب فيه إلا بإذن.','فيه جداول مش محمية: '+d.rls_off.join('، '));

    var sp=(c.secdef_no_path||[]);add(sp.length===0,'الدوال الحساسة مثبّتة على مكان آمن','كل الدوال الحساسة ليها إعداد أمان ثابت.','دوال من غير إعداد ثابت: '+sp.join('، '));

    rows.push([risky?null:true,'الدور المكتوب في صفحة الموظف مش بيتحكم في الصلاحيات',risky?'الدوال دي بتقرا الدور من صفحة الموظف نفسها وده ممكن يتعدّل: '+pr.join('، ')+'. تأثيرها صغير (تذكيرات) لكن الأفضل نخليها تقرا من جدول الأدوار. ابعتلي وأصلحها.':'الصلاحيات الحقيقية بتتحدد من جدول الأدوار، مش من بيانات الموظف.',null]);
    root.appendChild($('div','sec','فحوصات الأمان (كل بند بيقولك معناه)'));var cb=$('div','card');

    root.appendChild(cb);})();
      block('كتابة مفتوحة لأي موظف (غالباً مقصودة لشغل الفريق، للعلم بس)',d.open_staff||[],'لا يوجد ✓');
    root.appendChild($('div','sec','أكبر الجداول'));var tb=$('div','card list');
  d.tables.forEach(function(t){tb.appendChild($('div',null,t.name+' — '+t.rows+' صف — '+fmtB(t.bytes)))});root.appendChild(tb);
  root.appendChild($('div','sec','حدود لا تُقاس لحظياً (محتاجة مفتاح سري، فمش هنحطه في صفحة ويب)'));
  var lk=$('div','card list');
  [['Vercel (الباقة المجانية: 100GB نقل / شهر)','https://vercel.com/dashboard'],['Supabase (500MB قاعدة، 5GB نقل، 50 ألف مستخدم)','https://supabase.com/dashboard/projects'],['GitHub (استخدام Actions والتخزين)','https://github.com/settings/billing']].forEach(function(x){var a=$('a','link',x[0]);a.href=x[1];a.target='_blank';a.rel='noopener noreferrer';lk.appendChild(a);lk.appendChild($('br'))});
  root.appendChild(lk);

  document.getElementById('upd').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
}
document.getElementById('rf').onclick=function(){run().catch(function(e){msg('خطأ: '+(e&&e.message||e))})};
run().catch(function(e){msg('خطأ: '+(e&&e.message||e))});setInterval(function(){if(!document.hidden)run().catch(function(){})},60000);setInterval(function(){if(!document.hidden&&sb&&G.lat&&G.lat.el.parentNode)ping().then(function(){setLat(Math.round(median(lats)))}).catch(function(){})},6000);
})();
</script></body></html>
